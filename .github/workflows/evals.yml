name: Evals

# Real-model runs. These spend money, so they are not part of every push.
# The gate runs when something that changes the agent's behaviour changes,
# and the full suite runs on request.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        default: claude-sonnet-5-5
      repeats:
        description: Repeats per scenario
        default: "3"
      max_spend:
        description: Spend cap in dollars
        default: "3"
  pull_request:
    paths:
      - packages/agent/src/prompt.ts
      - packages/agent/src/resolution.ts
      - packages/policy/policies/**
      - mcp/billing/src/tools.ts

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the gate sample on the real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          pnpm evals --model claude-sonnet-5-5 --effort medium --scenarios gate
          --repeats 2 --max-spend 1 --min-pass-rate 0.9 --out gate.json

  full:
    name: Full suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run every scenario on the real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          REPEATS: ${{ inputs.repeats }}
          MAX_SPEND: ${{ inputs.max_spend }}
        run: >
          pnpm evals --model "$MODEL" --effort medium --repeats "$REPEATS"
          --max-spend "$MAX_SPEND" --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json
