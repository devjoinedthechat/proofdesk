name: Evals

# Real-model runs. They spend money, so they run only when someone starts
# them by hand, with the API key set as a repository secret. Nothing here
# runs on a push or a pull request: those use the free checks in ci.yml,
# including the replay of a recorded real-model run.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "gate: the quality gate sample, or full: every scenario"
        type: choice
        options: [gate, full]
        default: gate
      model:
        description: Model to evaluate
        default: claude-sonnet-5-5
      repeats:
        description: Repeats per scenario
        default: "2"
      max_spend:
        description: Spend cap in dollars
        default: "3"

permissions:
  contents: read

jobs:
  evals:
    name: Real-model evaluation (${{ inputs.what }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run on the real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHAT: ${{ inputs.what }}
          MODEL: ${{ inputs.model }}
          REPEATS: ${{ inputs.repeats }}
          MAX_SPEND: ${{ inputs.max_spend }}
        # The gate fails the job when the pass rate on its sample falls
        # under 90%.
        run: |
          if [ "$WHAT" = gate ]; then
            pnpm evals --model "$MODEL" --effort medium --scenarios gate \
              --repeats "$REPEATS" --max-spend "$MAX_SPEND" --min-pass-rate 0.9 --out results.json
          else
            pnpm evals --model "$MODEL" --effort medium --repeats "$REPEATS" \
              --max-spend "$MAX_SPEND" --out results.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: results.json
