# Keeps dependencies, actions and base images current, one grouped pull
# request per ecosystem per week. Security fixes come as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node version in .nvmrc, which is moved by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # A new major version of Node is a decision, taken together with
      # .nvmrc and the engines field, not an update.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
