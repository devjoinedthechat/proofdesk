# Keeps dependencies, actions and base images current, one grouped pull
# request per ecosystem per week. Security fixes come as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
