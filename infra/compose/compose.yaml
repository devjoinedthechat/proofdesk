# Local development stack. The credentials below are for local use only;
# the deployed target reads its secrets from a secret manager.
name: proofdesk

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: proofdesk
      POSTGRES_PASSWORD: proofdesk
      POSTGRES_DB: proofdesk
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username proofdesk --dbname proofdesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: proofdesk
      KC_DB_PASSWORD: proofdesk
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # One public name for the realm, whoever asks. A browser reaches Keycloak
      # at this address and the services reach it inside the network; tokens
      # name this address as their issuer either way.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships without curl, so the check speaks HTTP over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  temporal:
    # Single-binary dev server: workflow state is in memory and resets on restart.
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "proofdesk"]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Everything below is the application. It starts only with the "app"
  # profile (pnpm local:up), so `pnpm stack:up` still gives tests and local
  # development the three backing services alone.

  provision:
    # One image serves every service below. It is built here, once, and the
    # others wait for this step before they start.
    <<: &app
      image: proofdesk-local
      pull_policy: never
      profiles: ["app"]
      restart: "no"
      # A small init process as PID 1, so that a stop signal reaches Node
      # and the service can finish what it is doing.
      init: true
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    pull_policy: build
    command: ["node", "apps/stack/src/provision.ts"]
    environment:
      # Provisioning sets every secret up, so it is given them all. Each
      # service below gets its own and no other's.
      DB_ROLE_PASSWORD: ${DB_ROLE_PASSWORD:-local-role-password}
      WORKER_CLIENT_SECRET: &worker-secret ${WORKER_CLIENT_SECRET:-local-worker-secret}
      BILLING_MCP_CLIENT_SECRET: &billing-mcp-secret ${BILLING_MCP_CLIENT_SECRET:-local-billing-mcp-secret}
      ENTITLEMENTS_MCP_CLIENT_SECRET: &entitlements-mcp-secret ${ENTITLEMENTS_MCP_CLIENT_SECRET:-local-entitlements-mcp-secret}
      ACCOUNT_DELETION_CLIENT_SECRET: &deletion-secret ${ACCOUNT_DELETION_CLIENT_SECRET:-local-account-deletion-secret}
      DEMO_PASSWORD: &demo-password ${DEMO_PASSWORD:-local-demo-password}
      POSTGRES_ADMIN_URL: postgresql://proofdesk:proofdesk@postgres:5432/proofdesk
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      GRANT_ISSUER: &grant-issuer http://portal:3000
      STATE_DIR: /state
    volumes:
      - app-state:/state
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  billing:
    <<: *app
    restart: unless-stopped
    command: ["node", "services/billing/src/main.ts"]
    environment:
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      KEYCLOAK_ISSUER: &issuer http://localhost:${KEYCLOAK_PORT:-8080}/realms/proofdesk
      KEYCLOAK_BACKCHANNEL_URL: &backchannel http://keycloak:8080/realms/proofdesk
      BILLING_DATABASE_URL: postgresql://billing_app:${DB_ROLE_PASSWORD:-local-role-password}@postgres:5432/proofdesk_billing
    depends_on: &provisioned
      provision:
        condition: service_completed_successfully
    healthcheck: &http-health # Node is the only tool the image is sure to have.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/healthz").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 40

  entitlements:
    <<: *app
    restart: unless-stopped
    command: ["node", "services/entitlements/src/main.ts"]
    environment:
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      ENTITLEMENTS_DATABASE_URL: postgresql://entitlements_app:${DB_ROLE_PASSWORD:-local-role-password}@postgres:5432/proofdesk_entitlements
    depends_on: *provisioned
    healthcheck: *http-health

  billing-mcp:
    <<: *app
    restart: unless-stopped
    command: ["node", "mcp/billing/src/main.ts"]
    environment:
      BILLING_MCP_CLIENT_SECRET: *billing-mcp-secret
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      BILLING_URL: http://billing:3000
      PUBLIC_URL: http://billing-mcp:3000
    depends_on: *provisioned
    healthcheck: *http-health

  entitlements-mcp:
    <<: *app
    restart: unless-stopped
    command: ["node", "mcp/entitlements/src/main.ts"]
    environment:
      ENTITLEMENTS_MCP_CLIENT_SECRET: *entitlements-mcp-secret
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      ENTITLEMENTS_URL: http://entitlements:3000
      PUBLIC_URL: http://entitlements-mcp:3000
    depends_on: *provisioned
    healthcheck: *http-health

  documents-mcp:
    <<: *app
    restart: unless-stopped
    command: ["node", "mcp/documents/src/main.ts"]
    environment:
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      DOCUMENTS_DATABASE_URL: postgresql://documents_app:${DB_ROLE_PASSWORD:-local-role-password}@postgres:5432/proofdesk_documents
      PUBLIC_URL: http://documents-mcp:3000
    depends_on: *provisioned
    healthcheck: *http-health

  portal:
    <<: *app
    restart: unless-stopped
    command: ["node", "apps/portal/src/main.ts"]
    environment:
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      GRANT_ISSUER: *grant-issuer
      GRANT_KEY_FILE: /state/grant-key.json
      PORTAL_DATABASE_URL: postgresql://portal_app:${DB_ROLE_PASSWORD:-local-role-password}@postgres:5432/proofdesk_app
      GRANTS_DATABASE_URL: postgresql://grants_app:${DB_ROLE_PASSWORD:-local-role-password}@postgres:5432/proofdesk_app
      TEMPORAL_ADDRESS: &temporal temporal:7233
      TEMPORAL_NAMESPACE: &namespace proofdesk
      TEMPORAL_TASK_QUEUE: &queue tickets
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"
    volumes:
      - app-state:/state:ro
    depends_on:
      provision:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck: *http-health

  worker:
    <<: *app
    restart: unless-stopped
    command: ["node", "apps/worker/src/main.ts"]
    environment:
      WORKER_CLIENT_SECRET: *worker-secret
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      WORKER_DATABASE_URL: postgresql://worker_app:${DB_ROLE_PASSWORD:-local-role-password}@postgres:5432/proofdesk_app
      PORTAL_URL: http://portal:3000
      BILLING_MCP_URL: http://billing-mcp:3000/mcp
      ENTITLEMENTS_MCP_URL: http://entitlements-mcp:3000/mcp
      DOCUMENTS_MCP_URL: http://documents-mcp:3000/mcp
      # For deleting a customer's sign-in account on a deletion request: a
      # client that may manage the realm's users, not the administrator.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: proofdesk
      ACCOUNT_DELETION_CLIENT_SECRET: *deletion-secret
      TEMPORAL_ADDRESS: *temporal
      TEMPORAL_NAMESPACE: *namespace
      TEMPORAL_TASK_QUEUE: *queue
      # With an Anthropic key the agent is Claude. Without one, a scripted
      # stand-in that can handle a duplicate charge and nothing else.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL: ${MODEL:-claude-sonnet-5-5}
      MODEL_PROVIDER_MODULE: ${MODEL_PROVIDER_MODULE:-}
      # Where the watchdog's alerts are posted, such as a chat channel's webhook.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      INSPECTION_URL: http://phoenix:6006
      INSPECTION_API_KEY: ${PHOENIX_ADMIN_SECRET:-local-phoenix-admin-secret-0123456789}
    depends_on:
      provision:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      portal:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      phoenix:
        condition: service_healthy

  # Traces and metrics. One container with a collector, Tempo, Prometheus
  # and Grafana, meant for development.
  telemetry:
    image: grafana/otel-lgtm:0.41.0
    profiles: ["app"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/proofdesk.yaml:ro
      - ./grafana/proofdesk.json:/otel-lgtm/proofdesk.json:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  # The inspection store: full conversations, for a person to read. Unlike
  # the telemetry above it holds customer text, so it requires sign-in, each
  # company has its own project, and a deletion request removes from it.
  phoenix:
    image: arizephoenix/phoenix:version-21.1.0
    profiles: ["app"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:-local-phoenix-signing-secret-0123456789abcdef}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:-local-phoenix-admin-secret-0123456789}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${DEMO_PASSWORD:-local-demo-password}
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:6006/healthz")
      interval: 3s
      timeout: 3s
      retries: 60

  # Files a ticket as a customer and prints what happens: pnpm local:demo
  demo:
    <<: *app
    profiles: ["demo"]
    entrypoint: ["node", "apps/stack/src/demo.ts"]
    environment:
      DEMO_PASSWORD: *demo-password
      PORTAL_URL: http://portal:3000
      KEYCLOAK_ISSUER: *issuer
      KEYCLOAK_BACKCHANNEL_URL: *backchannel
      STATE_DIR: /state
    volumes:
      - app-state:/state:ro

volumes:
  postgres-data:
  app-state:
  phoenix-data:
